<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velocity Demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <main class="scene-shell">
    <div class="grain"></div>
    <div class="corner-mark">✕</div>

    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">INTERACTIVE DEMO // HANDHELD SERIES</p>
        <h1 id="hero-title">Velocity</h1>
        <p class="subcopy">Portable gaming, reimagined.</p>
        <div class="meta-row">
          <span class="instruction">MOVE // HOVER // SCROLL</span>
          <span class="active-pill">ICECREAM-01</span>
        </div>
      </div>

      <div class="ink ink-a"></div>
      <div class="ink ink-b"></div>
      <div class="ink ink-c"></div>
      <div class="ink ink-d"></div>

      <div id="canvas-wrap"></div>
    </section>

    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
