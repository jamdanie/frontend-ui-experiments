<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velocity</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <main class="site-shell">
    <div class="grain"></div>
    <div class="corner-x">✕</div>

    <section class="hero" id="hero">
      <div class="copy">
        <p class="eyebrow">INTERACTIVE DEMO // HANDHELD SERIES</p>
        <h1 id="heroTitle">Velocity</h1>
        <p class="subcopy">Portable gaming, reimagined.</p>

        <div class="meta">
          <span class="instruction">MOVE // HOVER // SCROLL</span>
          <span class="pill" id="activePill">ICECREAM-01</span>
        </div>
      </div>

      <div class="ink ink-a"></div>
      <div class="ink ink-b"></div>
      <div class="ink ink-c"></div>
      <div class="ink ink-d"></div>

      <div id="sceneWrap"></div>

      <ul class="variant-list" id="variantList">
        <li class="variant is-active">ICECREAM-01</li>
        <li class="variant">ICECREAM-02</li>
        <li class="variant">ICECREAM-03</li>
        <li class="variant">ICECREAM-04</li>
        <li class="variant">ICECREAM-05</li>
        <li class="variant">ICECREAM-06</li>
      </ul>
    </section>

    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
    <section class="driver"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
