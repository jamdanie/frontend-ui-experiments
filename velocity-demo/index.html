<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velocity Demo</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <main class="site-shell">
    <div class="noise"></div>
    <div class="corner-mark">✕</div>

    <section class="hero" id="hero">
      <div class="hero-copy">
        <p class="eyebrow">INTERACTIVE DEMO // HANDHELD SERIES</p>

        <h1 id="hero-title">
          <span class="title-line">Velocity</span>
        </h1>

        <p class="subcopy">Portable gaming, reimagined.</p>

        <div class="meta-row">
          <span class="instruction">MOVE // HOVER // SCROLL</span>
          <span class="active-pill" id="active-pill">ARC-01</span>
        </div>
      </div>

      <div class="hero-visual">
        <div class="ink ink-a"></div>
        <div class="ink ink-b"></div>
        <div class="ink ink-c"></div>
        <div class="ink ink-d"></div>

        <div class="card-stage" id="card-stage">
          <div class="card-shadow"></div>

          <div class="product-card ghost-card ghost-4">
            <img id="ghost-4" src="assets/p1.jpg" alt="Ghost product 4" />
          </div>

          <div class="product-card ghost-card ghost-3">
            <img id="ghost-3" src="assets/p1.jpg" alt="Ghost product 3" />
          </div>

          <div class="product-card ghost-card ghost-2">
            <img id="ghost-2" src="assets/p1.jpg" alt="Ghost product 2" />
          </div>

          <div class="product-card ghost-card ghost-1">
            <img id="ghost-1" src="assets/p1.jpg" alt="Ghost product 1" />
          </div>

          <div class="product-card card-front" id="card-front">
            <img id="image-front" src="assets/p1.jpg" alt="Active product" />
          </div>
        </div>

        <ul class="variant-list" id="variant-list">
          <li class="variant-item is-active">ARC-01</li>
          <li class="variant-item">NEON-02</li>
          <li class="variant-item">FROST-03</li>
          <li class="variant-item">GHOST-04</li>
          <li class="variant-item">VIOLET-05</li>
          <li class="variant-item">VOID-06</li>
        </ul>
      </div>
    </section>

    <section class="panel"></section>
    <section class="panel"></section>
    <section class="panel"></section>
    <section class="panel"></section>
    <section class="panel"></section>
    <section class="panel"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
