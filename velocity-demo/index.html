<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Velocity</title>
    <meta
      name="description"
      content="Interactive 3D demo."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/frontend-ui-experiments/velocity-demo/assets/index-BbHEyCNZ.js"></script>
    <link rel="stylesheet" crossorigin href="/frontend-ui-experiments/velocity-demo/assets/index-pvtc7KaO.css">
  </head>
  <body>
    <canvas id="liquid-cursor-canvas"></canvas>
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <div id="app">
      <section class="hero" id="hero">
        <div class="hero-bg">
          <div class="hero-gradient hero-gradient-1"></div>
          <div class="hero-gradient hero-gradient-2"></div>
          <div class="hero-grid"></div>

          <div class="geo geo-line geo-line-1" data-speed="0.04"></div>
          <div class="geo geo-line geo-line-2" data-speed="0.05"></div>
          <div class="geo geo-dot geo-dot-1" data-speed="0.03"></div>
          <div class="geo geo-dot geo-dot-2" data-speed="0.04"></div>
          <div class="geo geo-orb geo-orb-1" data-speed="0.02"></div>
        </div>

        <div class="hero-stage">
          <div class="hero-copy">
            <div class="eyebrow hover-target magnetic">Interactive Demo</div>

            <h1 class="hero-title hover-target" data-text="Velocity">
              <span class="hero-title-line glitch enable-on-hover" data-text="Velocity">
                Velocity
              </span>
            </h1>

            <p class="hero-sub">Realtime GLB / Motion / UI</p>
          </div>

          <div class="hero-canvas-shell">
            <div class="model-backlight"></div>
            <div class="model-halo"></div>
            <canvas id="webgl"></canvas>
            <div class="canvas-fade"></div>
          </div>

          <div class="hero-meta hero-meta-left">
            <span class="meta-chip hover-target magnetic">Prototype 01</span>
          </div>

          <div class="hero-meta hero-meta-right">
            <span class="meta-small">Scroll</span>
          </div>
        </div>
      </section>

      <section class="after-hero" id="details">
        <div class="after-inner">
          <span class="after-label">Capabilities</span>
          <p class="after-copy">3D staging, motion systems, interaction polish.</p>
        </div>
      </section>
    </div>

  </body>
</html>
