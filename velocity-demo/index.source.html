<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Velocity</title>
    <meta
      name="description"
      content="Premium interactive 3D demo."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="noise"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <div id="app">
      <section class="hero" id="hero">
        <div class="hero-bg">
          <div class="hero-gradient hero-gradient-1"></div>
          <div class="hero-gradient hero-gradient-2"></div>
          <div class="hero-grid"></div>

          <div class="geo geo-line geo-line-1" data-speed="0.08"></div>
          <div class="geo geo-line geo-line-2" data-speed="0.12"></div>
          <div class="geo geo-orb geo-orb-1" data-speed="0.06"></div>
          <div class="geo geo-orb geo-orb-2" data-speed="0.1"></div>
        </div>

        <div class="hero-stage">
          <div class="hero-copy">
            <div class="eyebrow hover-target">Interactive Demo</div>

            <h1 class="hero-title">
              <span class="hero-title-line">Velocity</span>
            </h1>

            <p class="hero-sub">
              3D. Motion. UI.
            </p>

            <div class="hero-actions">
              <a href="#details" class="chip hover-target">Enter</a>
            </div>
          </div>

          <div class="hero-canvas-shell">
            <div class="model-backlight"></div>
            <canvas id="webgl"></canvas>
            <div class="canvas-fade"></div>
          </div>
        </div>
      </section>

      <section class="panel panel-intro" id="details">
        <div class="container">
          <div class="panel-kicker">About</div>
          <h2>Motion-first product demo.</h2>
          <p>
            Built to showcase interaction, staging, and polish.
          </p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
